name: Deployment Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Daily rebuild: security patches should not wait for a weekly slot.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: deployment-verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Authenticated requests avoid the anonymous API rate limit that shared
  # GitHub runners regularly hit (api.github.com answers 403 otherwise).
  GH_API_TOKEN: ${{ github.token }}

jobs:
  lint:
    name: Lint workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint (GitHub Actions workflow linting)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            rhysd/actionlint:1.7.12 \
            -color

  scan-trivy:
    name: Scan pinned upstream image with Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    strategy:
      # Image refs are read from the compose file's x-images defaults at
      # runtime — single source of truth.
      fail-fast: false
      matrix:
        include:
          - name: zomboid-server
            env_var: ZOMBOID_SERVER_IMAGE_TAG

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned ${{ matrix.name }} image from the compose file
        id: pin
        env:
          ENV_VAR: ${{ matrix.env_var }}
        run: |
          image="$(grep -m1 -oE "\\\$\\{${ENV_VAR}:-.*" zomboid-server-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          if [ -z "$image" ]; then
            echo "${ENV_VAR} default not found in the compose x-images block" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Trivy scan of ${{ matrix.name }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.pin.outputs.image }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # FINDINGS DO NOT FAIL THIS STEP; A SCAN THAT CANNOT FINISH DOES.
          # Stated here rather than left to the action's default, because
          # this job no longer carries continue-on-error and the difference
          # now decides whether a red run means a new CVE upstream or a
          # scanner that died before it could report one.
          exit-code: "0"

      - name: Upload Trivy SARIF (${{ matrix.name }}) to GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  healthcheck:
    name: The health check, in both directions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        # Pinned, and the same image a maintainer runs locally: Ubuntu's
        # packaged shellcheck is a different version with different defaults.
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 \
            tools/*.sh scripts/*.sh tests/*.sh update.sh \
            tests/fixtures/fake-entry.sh tests/fixtures/fake-healthcheck.sh tests/fixtures/admin-password.sh

      - name: The health check goes by the game's answer, in the pinned image
        # tools/healthcheck.sh is healthy only on the server's reply to
        # A2S_INFO. Run in the pinned image, so its tools are proven there,
        # against a stand-in that answers, answers after a challenge, stays
        # silent, or is not there at all (tests/fixtures/fake-a2s.py). The real
        # server is the game job below.
        run: |
          chmod +x tests/e2e-healthcheck.sh
          ./tests/e2e-healthcheck.sh

      - name: The entrypoint puts both passwords where the game reads them, and on no command line
        # tools/start.sh in the pinned image, with a stand-in for the image's
        # entry.sh that asks for the admin password as the game does: the rcon
        # password in the ini, the admin password answered on the console only
        # when asked, both handed to the image empty, neither in docker logs,
        # and a start refused on a password it could not keep out of them.
        run: bash tests/e2e-start.sh

      - name: The refresh never recreates a server it cannot count
        # A fixture answers A2S with two players, three behind the challenge,
        # none, or not at all. Two players and silence must both leave the
        # server untouched, and silence must exit 1; nobody on, or --force,
        # must go ahead. tests/e2e-refresh.sh says why.
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 tests/e2e-refresh.sh scripts/refresh.sh
          chmod +x tests/e2e-refresh.sh
          ./tests/e2e-refresh.sh

      - name: The compose file parses with the shipped defaults
        run: |
          sed -E 's/^([A-Z0-9_]+)=$/\1=ci-placeholder/' .env.example > .env
          docker compose -f zomboid-server-docker-compose.yml config >/dev/null
          echo "compose OK"

  game:
    name: The real server, and the health check asking it
    # The game is about 10 GB, small enough for every push. It is installed
    # the way a first start does, the world is created, and the health check
    # is proven against it both ways: red until the server answers, green on
    # its A2S answer, red with the server stopped by SIGSTOP while the old
    # /proc check stays green, green again after SIGCONT.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      COMPOSE: docker compose -f zomboid-server-docker-compose.yml -p zomboid
      # tests/secret-probe.sh: the admin password and the rcon password each get
      # a value of its own, and neither may reach docker compose logs, the
      # game's own logs or a command line, in the container or on the host.
      PROBE_PROJECT: zomboid
      PROBE_EXPECT: ZOMBOID_SERVER_ADMIN_PASSWORD ZOMBOID_SERVER_RCON_PASSWORD
      # The game's own logs: the console copy it writes, and the day's logs.
      PROBE_GAME_LOGS: zomboid-server:/home/steam/Zomboid/server-console.txt zomboid-server:/home/steam/Zomboid/Logs/*.txt
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Make room for the game
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /

      - name: Docker 29.4.2 answers socketcall with ENOSYS; give its daemon the profile 29.4.3 ships
        # SteamCMD is 32-bit and makes every socket through socketcall(2),
        # which Docker Engine 29.4.2 alone refuses (moby/moby#52506); the
        # ubuntu-26.04 runner ships it. On that version, and only there, the
        # daemon gets the default profile 29.4.3 ships (moby/profiles seccomp
        # v0.2.3), pinned by commit and checksum.
        run: |
          v="$(docker version --format '{{.Server.Version}}')"
          if [ "$v" != 29.4.2 ]; then echo "Docker $v: its own profile allows socketcall"; exit 0; fi
          sudo curl -fsSL -o /etc/docker/seccomp-29.4.3.json \
            https://raw.githubusercontent.com/moby/profiles/836ae4d37ef2ec995c77c99fc55f5b5f3af3a897/seccomp/default.json
          echo "536529b665dd0972c37bfb569f5d4ac8a53592e7b00752bc39ff063ca9864c74  /etc/docker/seccomp-29.4.3.json" | sha256sum -c -
          f=/etc/docker/daemon.json
          [ -s "$f" ] || echo '{}' | sudo tee "$f" >/dev/null
          sudo jq '. + {"seccomp-profile": "/etc/docker/seccomp-29.4.3.json"}' "$f" | sudo tee "$f.new" >/dev/null
          sudo mv "$f.new" "$f"
          sudo systemctl restart docker

      - name: First start - the game is downloaded and the world created
        run: |
          cp .env.example .env
          # A value of its own for the admin password and the rcon password.
          tests/secret-probe.sh plant
          docker volume create zomboid-server-data >/dev/null
          docker volume create zomboid-server-game >/dev/null
          $COMPOSE up -d

      - name: Before the server answers, the check is red
        run: |
          cid="$($COMPOSE ps -q zomboid-server)"
          sleep 45
          n=0; out="$(docker exec "$cid" bash /healthcheck.sh 16261 2>&1)" || n=$?
          echo "45 s in: the check exits $n: $out"
          [ "$n" = 1 ] || { echo "::error::the check was green 45 seconds into a first start"; exit 1; }

      - name: Wait for the health check to go green
        run: |
          cid="$($COMPOSE ps -q zomboid-server)"
          for _ in $(seq 1 180); do
            s="$(docker inspect "$cid" --format '{{.State.Health.Status}}' 2>/dev/null || echo none)"
            if [ "$s" = healthy ]; then
              echo "health: $s"
              docker exec "$cid" bash /healthcheck.sh 16261 || exit 1
              tests/secret-probe.sh check "first start"; exit $?
            fi
            [ "$s" = unhealthy ] && break
            sleep 10
          done
          echo "::error::the server never reported healthy"
          $COMPOSE logs --tail 80
          echo "--- the health check's own words, last runs"
          docker inspect "$cid" --format '{{range .State.Health.Log}}exit {{.ExitCode}}: {{.Output}}{{end}}' | tail -c 2000
          echo "--- UDP sockets in the container"
          docker exec "$cid" cat /proc/net/udp
          exit 1

      - name: The admin account was made on the console with the password from .env; rcon takes the one in the ini
        # Neither password is on a command line any more, so each is proven
        # where it now lives: the account's stored hash against the planted
        # admin password (and a wrong one, which must not match), and an rcon
        # login with the planted rcon password (and a wrong one, refused).
        run: |
          cid="$($COMPOSE ps -q zomboid-server)"
          logs="$(docker logs "$cid" 2>&1)"
          grep -a -E "start.sh:|Command line admin password|administrator password|Confirm the password|Administrator account" <<<"$logs"
          grep -q "Command line admin password: null" <<<"$logs" || { echo "::error::the server did not start without an admin password on its command line"; exit 1; }
          grep -q "Administrator account '.*' created" <<<"$logs" || { echo "::error::no admin account was created"; exit 1; }
          echo "the ini, once the server has started: $(docker exec "$cid" stat -c '%U %a' /home/steam/Zomboid/Server/servertest.ini)"
          apw="$(sed -n 's/^ZOMBOID_SERVER_ADMIN_PASSWORD=//p' .env)"
          printf '%s\n' "$apw" | tests/fixtures/admin-password.sh admin || { echo "::error::the admin account does not have the password from .env"; exit 1; }
          if printf 'w%s\n' "$apw" | tests/fixtures/admin-password.sh admin; then echo "::error::a wrong password matched the admin account; the check proves nothing"; exit 1; fi
          # rcon: the login read to its verdict, then one command and its own
          # reply; a wrong password must exit 3, not pass as a login.
          reply="$(tools/rcon.sh players)" || { echo "::error::tools/rcon.sh with the password in the ini failed"; exit 1; }
          echo "rcon players, one command, its reply: $(head -1 <<<"$reply")"
          grep -q "Players connected" <<<"$reply" || { echo "::error::the reply to players is not the player list"; exit 1; }
          awk -F= '$1 == "ZOMBOID_SERVER_RCON_PASSWORD" { print $0 "w"; next } { print }' .env > "$RUNNER_TEMP/wrong.env"
          n=0; ZOMBOID_ENV_FILE="$RUNNER_TEMP/wrong.env" tools/rcon.sh players >/dev/null 2>&1 || n=$?
          rm -f "$RUNNER_TEMP/wrong.env"
          [ "$n" = 3 ] || { echo "::error::a wrong rcon password: exit $n, not 3"; exit 1; }
          echo "a wrong rcon password: refused, exit 3"

      - name: The backup and set-password, with the probe watching their command lines
        # The backup asks the server to save over rcon, the password on stdin.
        # set-password.sh reads a new admin password from stdin (-); the hash
        # proves it was set. A password given as its argument is refused.
        run: |
          rc=0
          # shellcheck disable=SC2016   # $1 and $2 are bash -c's own arguments
          tests/secret-probe.sh during "backup" bash -c 'ZOMBOID_BACKUP_DIR="$2" scripts/backup.sh > "$1" 2>&1' _ "$RUNNER_TEMP/backup.out" "$RUNNER_TEMP/backups" || rc=$?
          cat "$RUNNER_TEMP/backup.out"
          [ "$rc" = 0 ] || { echo "::error::the backup exited $rc"; exit 1; }
          grep -q "the server saved the world (Saving finish)" "$RUNNER_TEMP/backup.out" || { echo "::error::the backup did not see the server save"; exit 1; }
          ls "$RUNNER_TEMP/backups"
          new="n$(openssl rand -hex 10)"
          echo "::add-mask::$new"
          printf '%s\n' "$new" > "$RUNNER_TEMP/new-admin"
          # Its output up to the line before the new password, which it prints
          # once, at the end, and which is masked here as well.
          rc=0
          # shellcheck disable=SC2016   # $1 is bash -c's own argument
          tests/secret-probe.sh during "set-password" bash -c 'scripts/set-password.sh admin - > "$1" 2>&1' _ "$RUNNER_TEMP/set-password.out" < "$RUNNER_TEMP/new-admin" || rc=$?
          sed '/shown once/q' "$RUNNER_TEMP/set-password.out"
          [ "$rc" = 0 ] || { echo "::error::set-password.sh, watched by the probe, exited non-zero"; exit 1; }
          tests/fixtures/admin-password.sh admin < "$RUNNER_TEMP/new-admin" || { echo "::error::set-password.sh did not set the password it read"; exit 1; }
          n=0; scripts/set-password.sh admin "x$(openssl rand -hex 4)" >/dev/null 2>&1 || n=$?
          [ "$n" = 2 ] || { echo "::error::set-password.sh took a password as its argument (exit $n)"; exit 1; }
          echo "a password as the argument: refused, exit 2"

      - name: After a restart - the probe looks once more, the day's logs and the archived ones
        # The server moves the last start's logs into a folder under Logs/ when
        # it starts again; they are what an operator finds there, so they are
        # searched too.
        env:
          PROBE_GAME_LOGS: zomboid-server:/home/steam/Zomboid/server-console.txt zomboid-server:/home/steam/Zomboid/Logs/*.txt zomboid-server:/home/steam/Zomboid/Logs/*/*.txt
        run: |
          cid="$($COMPOSE ps -q zomboid-server)"
          t="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # A STOP SAVES THE WORLD. Docker's SIGTERM reaches tools/start.sh,
          # process 1, which tells the server on its console to quit; up to
          # v1.3.1 nothing got it, and Docker killed the server when the
          # two-minute grace period ran out (tests/clean-stop.sh on v1.3.1:
          # 122 s of 120, exit 137, run 43584727124).
          t0=$SECONDS
          $COMPOSE restart zomboid-server >/dev/null
          secs=$((SECONDS - t0))
          echo "the restart took ${secs}s (grace period 120 s)"
          docker logs --since "$t" "$cid" 2>&1 | grep -a -i -E "start.sh: stopping|quit|saving|shutting|exiting" | head -12
          [ "$secs" -lt 110 ] || { echo "::error::the server did not quit within the grace period; Docker killed it"; exit 1; }
          docker logs --since "$t" "$cid" 2>&1 | grep -q "start.sh: stopping: the server is told to save the world and quit" || { echo "::error::the stop never reached the server's console"; exit 1; }
          for _ in $(seq 1 60); do
            [ "$(docker inspect "$cid" --format '{{.State.Health.Status}}')" = healthy ] && docker exec "$cid" bash /healthcheck.sh 16261 >/dev/null 2>&1 && break
            sleep 10
          done
          docker exec "$cid" bash /healthcheck.sh 16261
          echo "the logs folder after a second start:"
          docker exec "$cid" sh -c 'cd /home/steam/Zomboid/Logs && find . -name "*.txt" | sort | head -20'
          # A world with its admin account: no question on the console, nothing
          # written to it, and the account keeps the password set-password.sh
          # gave it, not the one in .env.
          asked="$(docker logs --since "$t" "$cid" 2>&1 | grep -c "Enter new administrator password" || true)"
          echo "after a restart, the server asked for an admin password $asked time(s)"
          [ "$asked" = 0 ] || { echo "::error::the server asked for an admin password on a world that has its account"; exit 1; }
          tests/fixtures/admin-password.sh admin < "$RUNNER_TEMP/new-admin" || { echo "::error::a restart changed the admin password"; exit 1; }
          tests/secret-probe.sh check "after a restart"

      - name: Plant - the process that answers, stopped, keeps the old check green and turns this one red
        # The check up to v1.2.2 was ProjectZomboid in /proc. SIGSTOP on the process that
        # owns the port's UDP socket (tests/fixtures/port-owner.sh; a name match
        # is not enough, LinuxGSM's tmux carries the game's name and stopping it
        # stops nothing that answers) leaves every process there and nothing
        # answering: the old check must still pass and this one fail; after
        # SIGCONT this one passes again.
        run: |
          cid="$($COMPOSE ps -q zomboid-server)"
          # The owners are visible only to their own user; try every uid here.
          uids="$(docker exec "$cid" sh -c 'cat /proc/[0-9]*/status 2>/dev/null' | awk '/^Uid:/ { print $2 }' | sort -u)"
          own=""; as=""
          for u in $uids; do
            own="$(docker exec -u "$u" -i "$cid" sh -s 16261 < tests/fixtures/port-owner.sh 2>/dev/null)" && { as="$u"; break; }
          done
          [ -n "$own" ] || { echo "::error::no user in the container can see who owns UDP 16261"; docker exec "$cid" cat /proc/net/udp; exit 1; }
          echo "UDP 16261 is owned by (pid uid comm), as seen by uid $as:"; echo "$own"
          pids="$(awk '{ print $1 }' <<<"$own" | tr '\n' ' ')"
          docker exec -u "$as" "$cid" sh -c "kill -STOP $pids"
          st="$(docker exec "$cid" sh -c "for p in $pids; do cut -d' ' -f3 /proc/\$p/stat; done" | tr '\n' ' ')"
          o=0; docker exec "$cid" sh -c "grep -qs '^ProjectZomboid' /proc/[0-9]*/comm" || o=$?
          n=0; out="$(docker exec "$cid" bash /healthcheck.sh 16261 2>&1)" || n=$?
          docker exec -u "$as" "$cid" sh -c "kill -CONT $pids"
          echo "owners stopped (states: $st): the old check exits $o, the new one $n: $out"
          [ "$o" = 0 ] && [ "$n" = 1 ] || { echo "::error::expected the old check to pass (0) and the new one to fail (1)"; exit 1; }
          for _ in $(seq 1 30); do
            docker exec "$cid" bash /healthcheck.sh 16261 && exit 0
            sleep 2
          done
          echo "::error::the game did not answer again after SIGCONT"; exit 1

      - name: The probe sees what it looks for - a canary in a log and on two command lines
        run: tests/secret-probe.sh selftest

      - name: A stop - timed, its exit code, and the world saved (tests/clean-stop.sh)
        env:
          CLEAN_STOP_PROJECT: zomboid
          CLEAN_STOP_COMPOSE: zomboid-server-docker-compose.yml
        run: tests/clean-stop.sh zomboid-server "Saving finish"

      - name: Stop
        if: always()
        run: |
          $COMPOSE down -t 120 >/dev/null 2>&1 || true
          docker volume rm -f zomboid-server-data zomboid-server-game >/dev/null 2>&1 || true
